[package]
name = "gyges-qr"
description = "UTF-8 half-block terminal QR renderer and BC-UR (Keystone registry tags 49201-49207) codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
qrcode = { workspace = true }
ur = { workspace = true }
ur-registry = { workspace = true }
thiserror = { workspace = true }
rqrr = { workspace = true }
nokhwa = { workspace = true, optional = true }

[features]
# The camera path of `qr-scan`: native capture
# (AVFoundation, V4L2, Media Foundation). Off by default; the Linux backend
# needs libclang (`v4l2-sys-mit` runs bindgen for its V4L2 bindings).
camera = ["dep:nokhwa"]

[dev-dependencies]
hex = { workspace = true }

[lints]
workspace = true
