[package]
name = "gyges-core"
description = "Daemon-side wallet logic for gygesd: config, KeyRegistry, VaultManager, sync steps, transaction engine and the ZIP 320 queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# The x86-64 assembly field arithmetic (MULX, ADCX/ADOX) for proving and
# trial decryption (OVERVIEW.md Q-D6, docs/BENCHMARKS.md). Off by default:
# upstream has no runtime CPU detection, so the binary needs BMI2 and ADX
# (Broadwell / Zen or newer) and faults with an illegal instruction without
# them. Multi-threading and the AArch64 assembly need no feature: upstream's
# defaults turn on `multicore`, and `zakura-halo2-proofs` turns on
# `aarch64-asm` for every aarch64 Unix target.
perf-asm-x86_64 = ["pasta_curves/x86_64-asm", "orchard/x86_64-asm"]
# `keystone::emulator`: a Keystone in software for the tests (gygesd's and
# the regtest crate's).
test-util = []

