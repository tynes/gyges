[package]
name = "gyges-cli"
description = "Gyges CLI: command router, prompts and terminal QR UI over the gygesd Unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gyges"
path = "src/main.rs"

[dependencies]
gyges-proto = { workspace = true }
gyges-qr = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
clap = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
humantime = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }

[features]
# `pczt qr-scan` and the camera step of `tx send` (ROADMAP.md M5, fourth
# item). Off by default: native capture, and libclang on Linux
# (`v4l2-sys-mit` runs bindgen).
camera = ["gyges-qr/camera"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
