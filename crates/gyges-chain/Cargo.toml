[package]
name = "gyges-chain"
description = "ChainBackend: Zakura JSON-RPC (Case A) and Tor lightwalletd (Case B) CompactBlock sources, plus the shared block cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# An in-process fake `zakurad` JSON-RPC server, a fake lightwalletd
# `CompactTxStreamer` gRPC server (generated by `build.rs`, needs `protoc`)
# and a synthetic block builder, for tests of everything above
# `ChainBackend` (gygesd, the regtest harness).
test-util = ["dep:hyper-util", "dep:http-body-util", "dep:base64", "dep:incrementalmerkletree", "dep:tokio-stream", "dep:tonic-prost"]

[dependencies]
zcash_client_backend = { workspace = true }
zcash_protocol = { workspace = true }
zcash_primitives = { workspace = true }
zcash_address = { workspace = true }
transparent = { workspace = true }
orchard = { workspace = true }
sapling = { workspace = true }
prost = { workspace = true }
# `tls-ring`: tonic's TLS connector falls back to the ring provider when no
# process-wide rustls provider is installed, so the https path cannot panic
# if a future dependency also enables aws-lc-rs (docs/decisions.md §2.4).
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost = { workspace = true, optional = true }  # codec of the generated fake lightwalletd server
rusqlite = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
hyper = { workspace = true }   # reqwest's; named to recognise a connection closed unanswered
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
incrementalmerkletree = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }

[dev-dependencies]
gyges-chain = { path = ".", features = ["test-util"] }
tempfile = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
