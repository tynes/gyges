// The lightwalletd compact block format, as `zakura-client-backend`
// 0.1.0-rc9.1 generates it (`src/proto/compact_formats.rs`). Only the fake
// `CompactTxStreamer` server in `gyges_chain::testing` is generated from this
// file; every message is mapped (`extern_path` in `build.rs`) onto the
// upstream Rust type, so the wire format is upstream's, not this file's.
syntax = "proto3";
package cash.z.wallet.sdk.rpc;

message ChainMetadata {
  uint32 saplingCommitmentTreeSize = 1;
  uint32 orchardCommitmentTreeSize = 2;
  uint32 ironwoodCommitmentTreeSize = 3;
}

message CompactBlock {
  uint64 height = 2;
  bytes hash = 3;
  bytes prevHash = 4;
  uint32 time = 5;
  bytes header = 6;
  repeated CompactTx vtx = 7;
  ChainMetadata chainMetadata = 8;
}

message CompactTx {
  uint64 index = 1;
  bytes txid = 2;
  uint32 fee = 3;
  repeated CompactSaplingSpend spends = 4;
  repeated CompactSaplingOutput outputs = 5;
  repeated CompactOrchardAction actions = 6;
  repeated CompactOrchardAction ironwoodActions = 9;
  repeated CompactTxIn vin = 7;
  repeated TxOut vout = 8;
}

message CompactTxIn {
  bytes prevoutTxid = 1;
  uint32 prevoutIndex = 2;
}

message TxOut {
  uint64 value = 1;
  bytes scriptPubKey = 2;
}

message CompactSaplingSpend {
  bytes nf = 1;
}

message CompactSaplingOutput {
  bytes cmu = 1;
  bytes ephemeralKey = 2;
  bytes ciphertext = 3;
}

message CompactOrchardAction {
  bytes nullifier = 1;
  bytes cmx = 2;
  bytes ephemeralKey = 3;
  bytes ciphertext = 4;
}
