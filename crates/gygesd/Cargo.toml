[package]
name = "gygesd"
description = "Gyges wallet daemon: hosts the UDS tonic server and the background sync, mempool and TexQueue loops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gygesd"
path = "src/main.rs"

[dependencies]
gyges-proto = { workspace = true }
gyges-core = { workspace = true }
gyges-chain = { workspace = true }
zcash_client_backend = { workspace = true }
zcash_protocol = { workspace = true }
zcash_keys = { workspace = true }
pczt = { workspace = true }
age = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }  # BroadcastStream for StreamLogs followers
tonic = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
nix = { workspace = true, features = ["fs"] }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
gyges-chain = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
transparent = { workspace = true }

[lints]
workspace = true
