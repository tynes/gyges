[package]
name = "gygesd"
description = "Gyges wallet daemon: hosts the UDS tonic server and the background sync, mempool and TexQueue loops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gygesd"
path = "src/main.rs"

[dependencies]
gyges-proto = { workspace = true }
gyges-core = { workspace = true }
gyges-chain = { workspace = true }
gyges-qr = { workspace = true }
prost = { workspace = true }
zcash_client_backend = { workspace = true }
zcash_protocol = { workspace = true }
zcash_keys = { workspace = true }
zip32 = { workspace = true }
pczt = { workspace = true }
age = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }  # BroadcastStream for StreamLogs followers
tonic = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
nix = { workspace = true, features = ["fs", "resource"] }  # umask, RLIMIT_CORE
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
orchard = { workspace = true }
pczt = { workspace = true }
proptest = { workspace = true }
gyges-chain = { workspace = true, features = ["test-util"] }
gyges-core = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }  # service_fn in the policy-layer tests
tempfile = { workspace = true }
serde_json = { workspace = true }
transparent = { workspace = true }
zcash_primitives = { workspace = true }  # decoding the mined ZIP 320 transactions in the tests
zcash_address = { workspace = true }  # a Keystone-shaped UFVK (no Sapling item) in the import tests
bip32 = { workspace = true }  # ChildNumber, reading a PCZT input's BIP 44 path
secrecy = { workspace = true }  # the test seed's bytes

[lints]
workspace = true
