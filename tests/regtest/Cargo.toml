[package]
name = "gyges-regtest"
description = "End-to-end harness and scenarios that drive gygesd through the gyges binary (TESTING.md §2-3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[lib]
path = "harness/lib.rs"

[[test]]
name = "daemon"
path = "scenarios/daemon.rs"

[[test]]
name = "keys"
path = "scenarios/keys.rs"

[[test]]
name = "sync"
path = "scenarios/sync.rs"

[[test]]
name = "tx"
path = "scenarios/tx.rs"

[[test]]
name = "pczt"
path = "scenarios/pczt.rs"

# Against the pinned real zakurad (TESTING.md §3 rows 1–4); skips itself
# where no node binary is available.
[[test]]
name = "node"
path = "scenarios/node.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }  # JSON-RPC to zakurad from the sync harness
# The fake-node helpers in harness/fake.rs (shared by the scenarios).
gyges-chain = { workspace = true, features = ["test-util"] }
gyges-core = { workspace = true }
zcash_client_backend = { workspace = true }
zcash_client_sqlite = { workspace = true }
transparent = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
zcash_protocol = { workspace = true }
zcash_keys = { workspace = true }
bip0039 = { workspace = true }
zip32 = { workspace = true }

[lints]
workspace = true
