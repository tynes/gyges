name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Full debuginfo for the workspace plus its test targets overflows the
  # runner's disk; line tables keep backtraces readable at a fraction of it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: check, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace's debug build plus its test targets do not fit beside
      # the runner's preinstalled toolchains: the `cargo test` link step died
      # with "No space left on device" on every run before this step.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Ubuntu's apt protoc is 3.21 (2022) and rejects the `debug_redact`
      # field option, which needs protobuf 22 or newer.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  docs:
    name: proto and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's apt protoc is 3.21 (2022) and rejects the `debug_redact`
      # field option, which needs protobuf 22 or newer.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate proto
        run: protoc --proto_path=proto --descriptor_set_out=/dev/null proto/gyges.proto
      - name: Validate config examples in docs/architecture.md parse as TOML
        run: |
          python3 - <<'PY'
          import re, tomllib, sys
          text = open("docs/architecture.md").read()
          blocks = re.findall(r"```toml\n(.*?)```", text, re.S)
          assert blocks, "no toml blocks found"
          for b in blocks:
              tomllib.loads(b)
          print(f"{len(blocks)} toml block(s) parse")
          PY

  # End-to-end scenarios against the pinned real zakurad and zainod
  # (docs/testing.md §2, tests/regtest/versions.toml). The harness downloads the
  # zakurad release asset and the zainod `.crate` into target/regtest-bin/,
  # verifies both sha256s and builds zainod there (`cargo install --locked`,
  # in its own target directory, deleted afterwards; only where
  # GYGES_BUILD_ZAINOD is set, so `check` skips the backfill scenarios); the
  # directory is
  # cached on versions.toml. The node-free scenarios of the same crate also
  # run in `check`; this job is where the node and backfill ones stop
  # skipping.
  regtest:
    name: regtest (real zakurad + zaino)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace's debug build plus its test targets do not fit beside
      # the runner's preinstalled toolchains: the `cargo test` link step died
      # with "No space left on device" on every run before this step.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache the pinned zakurad and zainod
        uses: actions/cache@v4
        with:
          path: target/regtest-bin
          key: regtest-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/regtest/versions.toml') }}
      - run: cargo test --locked -p gyges-regtest --test node -- --nocapture
      - run: cargo test --locked -p gyges-regtest --test backfill -- --nocapture
        env:
          GYGES_BUILD_ZAINOD: "1"
      - run: df -h /
        if: always()
