name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Ubuntu's apt protoc is 3.21 (2022) and rejects the `debug_redact`
      # field option, which needs protobuf 22 or newer.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  docs:
    name: proto and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's apt protoc is 3.21 (2022) and rejects the `debug_redact`
      # field option, which needs protobuf 22 or newer.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate proto
        run: protoc --proto_path=proto --descriptor_set_out=/dev/null proto/gyges.proto
      - name: Validate config example in DATA_MODEL.md parses as TOML
        run: |
          python3 - <<'PY'
          import re, tomllib, sys
          text = open("DATA_MODEL.md").read()
          blocks = re.findall(r"```toml\n(.*?)```", text, re.S)
          assert blocks, "no toml blocks found"
          for b in blocks:
              tomllib.loads(b)
          print(f"{len(blocks)} toml block(s) parse")
          PY

  # End-to-end scenarios against the pinned real zakurad (TESTING.md §2,
  # tests/regtest/versions.toml). The harness downloads the release asset
  # into target/regtest-bin/ and verifies its sha256; the directory is cached
  # on the pinned tag. The node-free scenarios of the same crate also run in
  # `check`; this job is where the node ones stop skipping.
  regtest:
    name: regtest (real zakurad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache the pinned zakurad
        uses: actions/cache@v4
        with:
          path: target/regtest-bin
          key: zakurad-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/regtest/versions.toml') }}
      - run: cargo test --locked -p gyges-regtest --test node -- --nocapture
