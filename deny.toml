# cargo-deny configuration (OVERVIEW.md Q-O5). Run: cargo deny check

[graph]
all-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
# Each ignore names the path that pulls the crate in and why it is tolerated.
# Re-check on every Zakura / arti / age bump.
ignore = [
    # rsa 0.9: Marvin timing side channel. Pulled in by arti-client -> tor-key-forge
    # -> ssh-key. No upstream fix exists; Gyges never performs RSA operations
    # with a private key (the Tor client only verifies directory signatures).
    { id = "RUSTSEC-2023-0071", reason = "unfixed upstream; arti-client transitive; no RSA private-key use in Gyges" },
    # basic-toml unmaintained. Build-time only: age -> i18n-embed-fl (proc-macro)
    # -> i18n-config. Not linked into the binaries.
    { id = "RUSTSEC-2026-0374", reason = "proc-macro build dependency of age via i18n-config; not in the binaries" },
    # paste unmaintained. Proc-macro used by arti-client (fs-mistrust -> pwd-grp)
    # and others. Not linked into the binaries.
    { id = "RUSTSEC-2024-0436", reason = "proc-macro build dependency via arti-client; not in the binaries" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "BlueOak-1.0.0",   # minicbor (via ur, ur-registry); OSI approved
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies without a version and are
# never published (`publish = false`); that is the one wildcard form allowed.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # The CLI and daemon must never link OpenSSL; rustls only.
    { crate = "openssl-sys" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies on `main` (Q-D3); feature branches may add [patch] entries.
allow-git = []
